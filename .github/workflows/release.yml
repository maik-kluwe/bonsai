name: Release

# A release is a tag: v0.2.0 publishes the version 0.2.0 of package.json, and nothing else.
# Setup and steps: docs/DEVELOPMENT.md, "Releasing".
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    # The environment holds the manual approval, and the Marketplace's Trusted Publishing policy names it
    environment: production
    permissions:
      contents: write # creates the GitHub release
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: The tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: The tag must match the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1; }

      - run: npm ci
      - run: npm test
      - run: npm run package

      # No version argument: `vsce publish minor` would commit and tag by itself
      - name: Publish the package that was just built
        run: npx @vscode/vsce publish --oidc --packagePath "build/bonsai-git-${GITHUB_REF_NAME#v}.vsix"

      - name: Attach the same file to a GitHub release
        run: gh release create "$GITHUB_REF_NAME" "build/bonsai-git-${GITHUB_REF_NAME#v}.vsix" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
